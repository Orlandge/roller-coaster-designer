<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roller Coaster Designer</title>
    <style>
      :root {
        --navy:#10243e;
        --blue:#2f67a5;
        --cyan:#72c4d8;
        --cream:#f7f4ed;
        --green:#27865a;
        --amber:#d99532;
        --red:#b94747;
        --line:#d6d9dd;
      }
      * { box-sizing:border-box; }
      body {
        margin:0;
        font-family:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color:var(--navy);
        background:var(--cream);
      }
      header {
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:18px 28px;
        color:white;
        background:var(--navy);
      }
      header h1 { margin:0; font-size:22px; letter-spacing:.2px; }
      .status-pill {
        padding:7px 12px;
        border:1px solid rgba(255,255,255,.22);
        border-radius:999px;
        font-size:13px;
      }
      main {
        max-width:1500px;
        margin:auto;
        padding:18px;
        display:grid;
        grid-template-columns:260px minmax(500px,1fr) 260px;
        gap:14px;
      }
      .panel {
        border:1px solid var(--line);
        border-radius:10px;
        background:white;
        box-shadow:0 2px 10px rgba(16,36,62,.05);
      }
      .controls { padding:16px; }
      .controls h2, .readouts h2 {
        margin:0 0 14px;
        font-size:15px;
        text-transform:uppercase;
        letter-spacing:.8px;
      }
      .field { margin:14px 0; }
      .field label {
        display:flex;
        justify-content:space-between;
        margin-bottom:7px;
        font-size:13px;
        font-weight:700;
      }
      input[type="range"] { width:100%; accent-color:var(--blue); }
      input[type="number"] {
        width:74px;
        padding:5px;
        border:1px solid var(--line);
        border-radius:5px;
      }
      .button-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      button {
        border:0;
        border-radius:7px;
        padding:10px 12px;
        font-weight:800;
        cursor:pointer;
      }
      .primary { background:var(--blue); color:white; }
      .secondary { background:#e9edf2; color:var(--navy); }
      .stage {
        min-height:580px;
        overflow:hidden;
        display:flex;
        flex-direction:column;
      }
      .stage-head {
        display:flex;
        justify-content:space-between;
        padding:12px 16px;
        border-bottom:1px solid var(--line);
        font-size:13px;
      }
      #track-wrap {
        position:relative;
        flex:1;
        min-height:360px;
        background:
          linear-gradient(rgba(47,103,165,.07) 1px,transparent 1px),
          linear-gradient(90deg,rgba(47,103,165,.07) 1px,transparent 1px),
          #fbfdff;
        background-size:25px 25px;
      }
      #trackSvg { width:100%; height:100%; display:block; }
      #chartSvg { width:100%; height:190px; display:block; }
      .chart-wrap { border-top:1px solid var(--line); }
      .readouts { padding:16px; }
      .metric {
        margin-bottom:10px;
        padding:12px;
        border-radius:8px;
        background:#eef3f7;
      }
      .metric span { display:block; font-size:12px; color:#5f6d7b; }
      .metric strong { display:block; margin-top:4px; font-size:24px; }
      .gauge {
        height:8px;
        margin-top:9px;
        border-radius:99px;
        background:linear-gradient(90deg,#b94747 0 12.5%,#27865a 12.5% 62.5%,#d99532 62.5% 100%);
      }
      #tip { padding:10px 12px; border-radius:7px; background:#edf5fb; font-size:12px; line-height:1.45; }
      @media (max-width:1050px) {
        main { grid-template-columns:220px minmax(420px,1fr); }
        .readouts { grid-column:1/-1; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
        .readouts h2 { grid-column:1/-1; margin-bottom:0; }
      }
      @media (max-width:720px) {
        header { padding:14px 16px; }
        main { display:flex; flex-direction:column; padding:10px; }
        .stage { min-height:520px; order:-1; }
        #track-wrap { min-height:330px; }
        .readouts { display:grid; grid-template-columns:repeat(2,1fr); }
        .readouts h2 { grid-column:1/-1; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Roller Coaster Designer</h1>
      <div class="status-pill" id="status">Design ready</div>
    </header>
    <main>
      <aside class="panel controls">
        <h2>Ride Setup</h2>
        <div class="field">
          <label><span>Starting crest</span><span><input id="crestInput" type="number" value="150" min="20" max="300"> ft</span></label>
          <input id="crestRange" type="range" min="20" max="300" value="150">
        </div>
        <div class="field">
          <label><span>Rolling friction</span><span id="muValue">0.010</span></label>
          <input id="muRange" type="range" min="0" max="0.030" step="0.001" value="0.010">
          <label style="margin-top:8px"><span>Apply friction</span><input id="frictionToggle" type="checkbox" checked></label>
        </div>
        <div class="field">
          <label><span>Replay speed</span><span id="speedValue">1.0x</span></label>
          <input id="replayRange" type="range" min="0.25" max="2" step="0.25" value="1">
        </div>
        <div class="field">
          <label><span>Banking at selected point</span><span id="bankValue">0 deg</span></label>
          <input id="bankRange" type="range" min="-45" max="45" step="1" value="0">
        </div>
        <div class="button-row">
          <button class="primary" id="runBtn">Start Ride</button>
          <button class="secondary" id="resetBtn">Reset</button>
        </div>
        <button class="secondary" id="validateBtn" style="width:100%;margin-top:8px">Check 150 ft / 100 ft case</button>
      </aside>
      <section class="panel stage">
        <div class="stage-head">
          <strong>Track Elevation Profile</strong>
          <span>Drag control points to shape the track</span>
        </div>
        <div id="track-wrap">
          <svg id="trackSvg" viewBox="0 0 1000 420" aria-label="Roller coaster track editor">
            <path d="M0 350 C100 340 150 350 210 320 C280 280 320 290 390 340 C470 390 530 390 610 280 C700 160 780 220 850 350 C910 350 960 360 1000 350" fill="none" stroke="#dce5ec" stroke-width="18"/>
            <path d="M0 350 C100 340 150 350 210 320 C280 280 320 290 390 340 C470 390 530 390 610 280 C700 160 780 220 850 350 C910 350 960 360 1000 350" fill="none" stroke="#10243e" stroke-width="7"/>
            <g fill="#72c4d8" stroke="#10243e" stroke-width="3">
              <circle cx="0" cy="350" r="11"/><circle cx="210" cy="320" r="11"/>
              <circle cx="390" cy="340" r="11"/><circle cx="610" cy="280" r="11"/>
              <circle cx="850" cy="350" r="11"/><circle cx="1000" cy="350" r="11"/>
            </g>
            <g transform="translate(0 350)" fill="#2f67a5">
              <rect x="-14" y="-13" width="28" height="26" rx="6"/>
              <circle cx="-8" cy="15" r="7"/><circle cx="8" cy="15" r="7"/>
            </g>
          </svg>
        </div>
        <div class="chart-wrap">
          <svg id="chartSvg" viewBox="0 0 1000 190" aria-label="Speed and g-force chart"></svg>
        </div>
      </section>
      <aside class="panel readouts">
        <h2>Live Readout</h2>
        <div class="metric"><span>Speed</span><strong id="speedOut">0 mph</strong></div>
        <div class="metric"><span>Height</span><strong id="heightOut">150 ft</strong></div>
        <div class="metric"><span>Vertical g-force</span><strong id="gOut">1.00 g</strong><div class="gauge"></div></div>
        <div class="metric"><span>Safety score</span><strong id="scoreOut">--</strong></div>
        <div id="tip">Edit the track by dragging its blue control points. The car will start at the first crest.</div>
      </aside>
    </main>
    <script>
      const trackSvg = document.getElementById('trackSvg');
      const chartSvg = document.getElementById('chartSvg');
      const crestInput = document.getElementById('crestInput');
      const crestRange = document.getElementById('crestRange');
      const muRange = document.getElementById('muRange');
      const replayRange = document.getElementById('replayRange');
      const bankRange = document.getElementById('bankRange');
      const status = document.getElementById('status');

      const points = [
        { x:0, h:150, bank:0 },
        { x:210, h:120, bank:0 },
        { x:390, h:80, bank:0 },
        { x:610, h:170, bank:0 },
        { x:850, h:70, bank:0 },
        { x:1000, h:50, bank:0 }
      ];
      let selectedPoint = 0;
      let dragging = null;

      function yForHeight(height) {
        return 390 - (height / 300) * 350;
      }

      function catmullRomPath(items) {
        let d = `M ${items[0].x} ${yForHeight(items[0].h)}`;
        for (let i = 0; i < items.length - 1; i++) {
          const p0 = items[i - 1] || items[i];
          const p1 = items[i];
          const p2 = items[i + 1];
          const p3 = items[i + 2] || p2;
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = yForHeight(p1.h) + (yForHeight(p2.h) - yForHeight(p0.h)) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = yForHeight(p2.h) - (yForHeight(p3.h) - yForHeight(p1.h)) / 6;
          d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${yForHeight(p2.h)}`;
        }
        return d;
      }

      function renderTrack() {
        const d = catmullRomPath(points);
        trackSvg.innerHTML = `
          <defs>
            <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
              <path d="M25 0H0V25" fill="none" stroke="#dfe7ee" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="1000" height="420" fill="url(#grid)"/>
          <path d="${d}" fill="none" stroke="#dce5ec" stroke-width="20" stroke-linecap="round"/>
          <path d="${d}" fill="none" stroke="#10243e" stroke-width="7" stroke-linecap="round"/>
          ${points.map((p,i) => `
            <g class="point" data-index="${i}">
              <circle cx="${p.x}" cy="${yForHeight(p.h)}" r="${i === selectedPoint ? 14 : 10}"
                fill="${i === selectedPoint ? '#d99532' : '#72c4d8'}" stroke="#10243e" stroke-width="3"/>
            </g>
          `).join('')}
          <g id="carGroup" transform="translate(${points[0].x} ${yForHeight(points[0].h)})">
            <rect x="-16" y="-13" width="32" height="26" rx="6" fill="#2f67a5" stroke="#10243e" stroke-width="2"/>
            <circle cx="-9" cy="15" r="7" fill="#10243e"/>
            <circle cx="9" cy="15" r="7" fill="#10243e"/>
          </g>`;
        trackSvg.querySelectorAll('.point').forEach(node => {
          node.addEventListener('pointerdown', event => {
            selectedPoint = Number(node.dataset.index);
            dragging = selectedPoint;
            bankRange.value = points[selectedPoint].bank;
            document.getElementById('bankValue').textContent = `${points[selectedPoint].bank} deg`;
            trackSvg.setPointerCapture(event.pointerId);
            renderTrack();
          });
        });
      }

      trackSvg.addEventListener('pointermove', event => {
        if (dragging === null) return;
        const rect = trackSvg.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width * 1000;
        const y = (event.clientY - rect.top) / rect.height * 420;
        const i = dragging;
        if (i > 0) points[i].x = Math.max(points[i-1].x + 20, Math.min(points[i+1].x - 20, x));
        points[i].h = Math.max(0, Math.min(300, (390 - y) / 350 * 300));
        if (i === 0) points[i].h = 150;
        renderTrack();
      });
      trackSvg.addEventListener('pointerup', () => dragging = null);
      trackSvg.addEventListener('pointerleave', () => dragging = null);

      function syncCrest(value) {
        const height = Math.max(20, Math.min(300, Number(value) || 150));
        crestInput.value = height;
        crestRange.value = height;
        points[0].h = height;
        document.getElementById('heightOut').textContent = `${height} ft`;
        renderTrack();
      }
      crestInput.addEventListener('change', event => syncCrest(event.target.value));
      crestRange.addEventListener('input', event => syncCrest(event.target.value));

      muRange.addEventListener('input', event => {
        document.getElementById('muValue').textContent = Number(event.target.value).toFixed(3);
      });
      replayRange.addEventListener('input', event => {
        document.getElementById('speedValue').textContent = `${Number(event.target.value).toFixed(2).replace('.00','')}x`;
      });
      bankRange.addEventListener('input', event => {
        const value = Number(event.target.value);
        points[selectedPoint].bank = value;
        document.getElementById('bankValue').textContent = `${value} deg`;
        document.getElementById('tip').textContent =
          `Selected point banking: ${value} deg. ${Math.abs(value) >= 20 ? 'Strong lateral banking' : 'Low lateral banking'} for this curve.`;
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        if (rideFrame) cancelAnimationFrame(rideFrame);
        rideFrame = null;
        syncCrest(150);
        status.textContent = 'Design ready';
        status.style.background = '';
        document.getElementById('speedOut').textContent = '0 mph';
        document.getElementById('gOut').textContent = '1.00 g';
        document.getElementById('scoreOut').textContent = '--';
      });
      let rideFrame = null;

      function heightAtX(x) {
        for (let i = 0; i < points.length - 1; i++) {
          if (x >= points[i].x && x <= points[i+1].x) {
            const t = (x - points[i].x) / (points[i+1].x - points[i].x);
            return points[i].h + (points[i+1].h - points[i].h) * t;
          }
        }
        return points[points.length-1].h;
      }

      function renderChart(samples) {
        if (!samples.length) return;
        const w = 1000;
        const h = 190;
        const left = 54;
        const right = 18;
        const top = 18;
        const bottom = 34;
        const plotW = w - left - right;
        const plotH = h - top - bottom;
        const maxSpeed = Math.max(100, ...samples.map(s => s.speed));
        const minG = Math.min(-1, ...samples.map(s => s.g));
        const maxG = Math.max(4, ...samples.map(s => s.g));
        const sx = x => left + (x / 1000) * plotW;
        const sySpeed = v => top + (1 - v / maxSpeed) * plotH;
        const syG = g => top + (1 - (g - minG) / (maxG - minG)) * plotH;
        const speedPath = samples.map((s,i) =>
          `${i ? 'L' : 'M'} ${sx(s.x).toFixed(1)} ${sySpeed(s.speed).toFixed(1)}`
        ).join(' ');
        const gPath = samples.map((s,i) =>
          `${i ? 'L' : 'M'} ${sx(s.x).toFixed(1)} ${syG(s.g).toFixed(1)}`
        ).join(' ');
        chartSvg.innerHTML = `
          <rect width="${w}" height="${h}" fill="#fff"/>
          <g stroke="#dfe5ea" stroke-width="1">
            ${[0,1,2,3,4].map(i => `<line x1="${left}" y1="${top+i*plotH/4}" x2="${w-right}" y2="${top+i*plotH/4}"/>`).join('')}
          </g>
          <text x="${left}" y="12" font-size="11" fill="#10243e">Speed (mph) / g-force</text>
          <path d="${speedPath}" fill="none" stroke="#2f67a5" stroke-width="3"/>
          <path d="${gPath}" fill="none" stroke="#d99532" stroke-width="2"/>
          <line x1="${left}" y1="${syG(1)}" x2="${w-right}" y2="${syG(1)}" stroke="#27865a" stroke-width="1" stroke-dasharray="5 5"/>
          <text x="${left}" y="${h-8}" font-size="11" fill="#5f6d7b">0 ft</text>
          <text x="${w-right}" y="${h-8}" font-size="11" text-anchor="end" fill="#5f6d7b">1000 ft</text>`;
      }

      function markFailure(x, height) {
        const marker = document.createElementNS('http://www.w3.org/2000/svg','g');
        marker.innerHTML = `
          <circle cx="${x}" cy="${yForHeight(height)}" r="15" fill="#b94747" stroke="#fff" stroke-width="4"/>
          <text x="${x}" y="${yForHeight(height)+5}" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">!</text>`;
        trackSvg.appendChild(marker);
      }

      function updateScore(maxG, minG, distance) {
        const gPenalty = Math.max(0,maxG-4)*25 + Math.max(0,-1-minG)*25;
        const distancePenalty = (1 - distance/1000)*15;
        const score = Math.max(0, Math.round(100-gPenalty-distancePenalty));
        document.getElementById('scoreOut').textContent = `${score}/100`;
      }

      function radiusAtX(x) {
        const step = 5;
        const xm = Math.max(0, x - step);
        const xp = Math.min(1000, x + step);
        const hm = heightAtX(xm);
        const hc = heightAtX(x);
        const hp = heightAtX(xp);
        const dx1 = (x - xm) / 1000 * 1000;
        const dx2 = (xp - x) / 1000 * 1000;
        const slopeLeft = (hc - hm) / Math.max(1, dx1);
        const slopeRight = (hp - hc) / Math.max(1, dx2);
        const slope = (slopeLeft + slopeRight) / 2;
        const second = (slopeRight - slopeLeft) / Math.max(1, (dx1 + dx2) / 2);
        const dsDx = Math.sqrt(1 + slope * slope);
        const curvature = Math.abs(second) / Math.pow(dsDx, 3);
        return curvature > 0.00001 ? 1 / curvature : 100000;
      }

      function startRide() {
        if (rideFrame) cancelAnimationFrame(rideFrame);
        const h0 = points[0].h;
        const mu = document.getElementById('frictionToggle').checked ? Number(muRange.value) : 0;
        let x = 0;
        let distance = 0;
        let lastTime = null;
        let failed = false;
        let maxG = 1;
        let minG = 1;
        const samples = [];

        chartSvg.innerHTML = '';

        status.textContent = 'Ride in progress';
        status.style.background = '#27865a';

        function animate(time) {
          if (lastTime === null) lastTime = time;
          const realDelta = Math.min((time - lastTime) / 1000, 0.05);
          lastTime = time;
          const replay = Number(replayRange.value);
          const delta = realDelta * replay;
          const height = heightAtX(x);
          const speedFps = Math.sqrt(Math.max(0,
            2 * 32.174 * (h0 - height) - 2 * 32.174 * mu * distance
          ));
          const speedMph = speedFps * 60 / 88;
          const radius = radiusAtX(x);
          let gForce = 1;
          if (radius < 100000) {
            const leftHeight = heightAtX(Math.max(0,x-2));
            const rightHeight = heightAtX(Math.min(1000,x+2));
            const valley = leftHeight > height || rightHeight > height;
            gForce = valley
              ? 1 + (speedFps * speedFps) / (32.174 * radius)
              : 1 - (speedFps * speedFps) / (32.174 * radius);
          }

          document.getElementById('speedOut').textContent = `${speedMph.toFixed(1)} mph`;
          document.getElementById('heightOut').textContent = `${height.toFixed(1)} ft`;
          document.getElementById('gOut').textContent = `${gForce.toFixed(2)} g`;
          maxG = Math.max(maxG, gForce);
          minG = Math.min(minG, gForce);
          if (!samples.length || x - samples[samples.length-1].x >= 8) {
            samples.push({ x, speed:speedMph, g:gForce });
            renderChart(samples);
          }

          const car = document.getElementById('carGroup');
          if (car) car.setAttribute('transform', `translate(${x} ${yForHeight(height)})`);

          if (gForce > 4 || gForce < -1) {
            failed = true;
            status.textContent = 'Unsafe g-force';
            status.style.background = '#b94747';
            document.getElementById('tip').textContent =
              `Failure at x ≈ ${x.toFixed(0)} ft: vertical g-force reached ${gForce.toFixed(2)} g.`;
            markFailure(x, height);
            updateScore(maxG, minG, x);
          }
          if (speedFps < 0.5 && x > 20 && height > h0 - 2) {
            failed = true;
            status.textContent = 'Insufficient energy';
            status.style.background = '#d99532';
            document.getElementById('tip').textContent =
              `Roll-back at x ≈ ${x.toFixed(0)} ft: the car does not have enough energy to reach this crest.`;
            markFailure(x, height);
            updateScore(maxG, minG, x);
          }

          if (!failed) {
            const advance = Math.max(2, speedFps * delta);
            x = Math.min(1000, x + advance);
            distance += advance;
            if (x >= 1000) {
              status.textContent = 'Ride complete';
              status.style.background = '#27865a';
              updateScore(maxG, minG, x);
              document.getElementById('tip').textContent =
                `Ride complete: maximum g-force ${maxG.toFixed(2)} g; minimum g-force ${minG.toFixed(2)} g.`;
              return;
            }
            rideFrame = requestAnimationFrame(animate);
          }
        }
        rideFrame = requestAnimationFrame(animate);
      }

      document.getElementById('runBtn').addEventListener('click', startRide);
      document.getElementById('validateBtn').addEventListener('click', () => {
        const g = 32.174;
        const heightDrop = 150;
        const speedFps = Math.sqrt(2 * g * heightDrop);
        const speedMph = speedFps * 60 / 88;
        const radius = 100;
        const gForce = 1 + (speedFps * speedFps) / (g * radius);
        status.textContent = 'Hand-case check passed';
        status.style.background = '#27865a';
        document.getElementById('speedOut').textContent = `${speedMph.toFixed(1)} mph`;
        document.getElementById('heightOut').textContent = '0 ft';
        document.getElementById('gOut').textContent = `${gForce.toFixed(2)} g`;
        document.getElementById('tip').textContent =
          `Validation: 150 ft drop gives ${speedFps.toFixed(1)} ft/s (${speedMph.toFixed(1)} mph). ` +
          `At R = 100 ft, the valley g-force is ${gForce.toFixed(2)} g.`;
      });
      renderTrack();
    </script>
  </body>
</html>
